style:
  MagicNumber:
    active: false # dp/sp literals and offsets are pervasive in UI code; tokens live in core/designsystem instead.
  ReturnCount:
    active: true
    max: 4 # guard-clause early returns for validation are more readable than nested if/else.

complexity:
  LongParameterList:
    active: true
    constructorThreshold: 8
    functionThreshold: 6
    ignoreAnnotated: ["Composable"] # Compose components conventionally take one param per slot/style.
  TooManyFunctions:
    active: true
    thresholdInObjects: 20 # a policy object like FeatureGate is one boolean check per spec row.
    thresholdInInterfaces: 20 # Room DAOs are conventionally many narrow, single-purpose queries.
    thresholdInClasses: 20 # repositories wrap many narrow DAO methods, same shape as the DAOs themselves.

naming:
  active: true
  FunctionNaming:
    ignoreAnnotated: ["Composable"] # Compose functions are PascalCase by convention.
